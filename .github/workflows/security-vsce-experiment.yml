name: Test VSIX security remediation (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/security-vsce-experiment.yml"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Evaluate compatible version pair
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.devDependencies['@vscode/vsce'] = '3.9.2';
          p.overrides = { ...p.overrides, '@azure/identity': '4.2.1' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Clean install and security audit
        run: |
          npm ci --ignore-scripts
          npm ls @vscode/vsce @azure/identity @azure/msal-node || true
          npm audit --audit-level=high
      - name: Full functional, VSIX verification
        run: |
          npm run check
          npm exec -- vsce package --pre-release --no-dependencies
          node scripts/verify-vsix.mjs $(find . -maxdepth 1 -name '*.vsix' -print -quit)
      - name: Emit reproducible manifests to build log (public dependency data)
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          for (const name of ['package.json', 'package-lock.json']) {
            const content = JSON.stringify(fs.readFileSync(name, 'utf8'));
            const group = name === 'package.json' ? 'MANIFEST' : 'LOCKFILE';
            console.log(group + '_BEGIN');
            for (let i = 0, n = 0; i < content.length; i += 6000, n++) {
              console.log(group + '_PART_' + String(n).padStart(3,'0') + '=' + content.slice(i, i + 6000));
            }
            console.log(group + '_END');
          }
          NODE
