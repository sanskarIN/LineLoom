name: Publish LineLoom v1.3.0 GitHub stable (owner authorized)
on:
  push:
    branches: [main]
    paths:
      - .github/release-v1.3.0.flag
permissions:
  contents: read
concurrency:
  group: lineloom-github-stable-v1.3.0
  cancel-in-progress: false
jobs:
  publish:
    name: Independently verify, package and publish GitHub stable
    if: github.repository == 'sanskarIN/LineLoom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require explicit flag and exact stable manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/release-v1.3.0.flag)" = "OWNER_AUTHORIZED_GITHUB_STABLE_V1.3.0_MANUAL_QA_DISCLOSED"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(p.name !== 'lineloom' || p.publisher !== 'SanskarCodes' ||
             p.version !== '1.3.0' || l.version !== p.version ||
             l.packages?.['']?.version !== p.version ||
             p.devDependencies?.['@vscode/vsce'] !== '3.9.2')
            throw Error('v1.3.0 stable manifest, publisher or package lock mismatch');
          const notes = fs.readFileSync('docs/releases/v1.3.0.md','utf8');
          if(!notes.includes('NOT RUN') || !notes.includes('four moderate') ||
             !notes.includes('not automatically updated'))
            throw Error('Stable release notes must accurately disclose QA and registry limitations');
          NODE
      - name: Install exact locked development dependencies
        run: npm ci
      - name: Verify source, test, documentation and production bundle
        run: npm run check
      - name: Run mocked Ollama in actual VS Code editor host
        run: xvfb-run -a npm run test:integration
      - name: Audit dependencies that can ship at runtime (moderate and above)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complete toolchain (high and critical)
        run: npm audit --audit-level=high
      - name: Package true stable-channel VSIX and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          npx vsce package --no-dependencies -o LineLoom-1.3.0.vsix
          LINELOOM_EXPECT_STABLE=1 npm run verify:vsix -- LineLoom-1.3.0.vsix
          sha256sum LineLoom-1.3.0.vsix > LineLoom-1.3.0.sha256
          sha256sum --check LineLoom-1.3.0.sha256
      - name: Install stable candidate into clean isolated VS Code profile
        run: xvfb-run -a npm run test:install-vsix -- LineLoom-1.3.0.vsix
      - name: Retrieve SHA-pinned published stable and preview baselines
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.0.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.0/LineLoom-1.2.0.vsix
          echo "a968f88faa2515db024cc10cf439213070ac596a9f1eb823263cbd4461951cbd  LineLoom-1.2.0.vsix" | sha256sum --check
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.3.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.3/LineLoom-1.2.3.vsix
          echo "a940b479f615bfc166a1ba1357f0f2d076532ffac220dbc0194f71fac51d4019  LineLoom-1.2.3.vsix" | sha256sum --check
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.4.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.4/LineLoom-1.2.4.vsix
          echo "05a715f49fe332ec53c63de80f3ebdabedc8a55c07ce2aa8b000c69ddee2ccec  LineLoom-1.2.4.vsix" | sha256sum --check
      - name: Install published baselines and upgrade to genuine stable candidate
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a npm run test:upgrade-vsix -- LineLoom-1.2.0.vsix LineLoom-1.3.0.vsix
          xvfb-run -a npm run test:upgrade-vsix -- LineLoom-1.2.3.vsix LineLoom-1.3.0.vsix
          xvfb-run -a npm run test:upgrade-vsix -- LineLoom-1.2.4.vsix LineLoom-1.3.0.vsix
      - name: Refuse replacing an existing tag or GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo "GitHub release v1.3.0 already exists; refusing overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.0 >/dev/null; then
            echo "Git tag v1.3.0 already exists; refusing overwrite."
            exit 1
          fi
      - name: Publish GitHub stable only (never marketplace or npm)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.0 \
            LineLoom-1.3.0.vsix LineLoom-1.3.0.sha256 \
            --target "${GITHUB_SHA}" --latest \
            --title "LineLoom v1.3.0 — Stable · Explicit Private Context" \
            --notes-file docs/releases/v1.3.0.md
      - name: Validate published stable tag and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sanskarIN/LineLoom/releases/tags/v1.3.0 \
            --jq 'if (.prerelease == false and .draft == false and (.assets | map(.name) | sort) == ["LineLoom-1.3.0.sha256","LineLoom-1.3.0.vsix"]) then "PASS: public stable release with VSIX and checksum" else error("Unexpected release classification or assets") end'
