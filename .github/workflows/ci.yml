name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript, lint, unit tests and build
        run: npm run check
  integration:
    name: Extension host (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Run VS Code extension-host integration
        run: xvfb-run -a npm run test:integration
  package:
    name: v1.2.1 patch VSIX candidate
    runs-on: ubuntu-latest
    needs: [check, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Build stable-channel VSIX and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce package --no-dependencies -o "LineLoom-${VERSION}.vsix"
          LINELOOM_EXPECT_STABLE=1 npm run verify:vsix -- "LineLoom-${VERSION}.vsix"
          sha256sum "LineLoom-${VERSION}.vsix" > "LineLoom-${VERSION}.sha256"
      - name: Install packaged stable candidate in a clean VS Code CLI profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:install-vsix -- "LineLoom-${VERSION}.vsix"
      - name: Download and verify published v1.2.0 stable VSIX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.0.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.0/LineLoom-1.2.0.vsix
          # Pin the GitHub release asset's verified SHA-256, not an
          # untrusted checksum fetched from the same source at test time.
          printf '%s  %s\\n' \
            a968f88faa2515db024cc10cf439213070ac596a9f1eb823263cbd4461951cbd \
            LineLoom-1.2.0.vsix | sha256sum --check
      - name: Upgrade published stable to candidate in an isolated VS Code CLI profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:upgrade-vsix -- "LineLoom-1.2.0.vsix" "LineLoom-${VERSION}.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: lineloom-v1.2.1-patch-candidate
          # Never ship the downloaded v1.2.0 baseline as a candidate asset.
          path: |
            LineLoom-1.2.1.vsix
            LineLoom-1.2.1.sha256
          if-no-files-found: error
