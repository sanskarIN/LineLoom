name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript, lint, unit tests and build
        run: npm run check
  integration:
    name: Extension host (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build
      - name: Run VS Code extension-host integration
        run: xvfb-run -a npm run test:integration
  package:
    name: VSIX preview candidate
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run check
      - name: Build VSIX package
        run: npx vsce package --no-dependencies -o LineLoom-0.5.1.vsix
      - name: Checksum
        run: sha256sum LineLoom-0.5.1.vsix > LineLoom-0.5.1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LineLoom-0.5.1-candidate
          path: |
            LineLoom-0.5.1.vsix
            LineLoom-0.5.1.sha256
          if-no-files-found: error
