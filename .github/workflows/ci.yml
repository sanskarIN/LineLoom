name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript, lint, unit tests and build
        run: npm run check
  integration:
    name: Extension host (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Run VS Code extension-host integration
        run: xvfb-run -a npm run test:integration
  package:
    name: v1.1.0 pre-release VSIX candidate
    runs-on: ubuntu-latest
    needs: [check, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Build preview-marked VSIX and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce package --pre-release --no-dependencies -o "LineLoom-${VERSION}.vsix"
          LINELOOM_EXPECT_PRE_RELEASE=1 npm run verify:vsix -- "LineLoom-${VERSION}.vsix"
          sha256sum "LineLoom-${VERSION}.vsix" > "LineLoom-${VERSION}.sha256"
      - name: Install packaged preview in a clean VS Code CLI profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:install-vsix -- "LineLoom-${VERSION}.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: lineloom-v1.1.0-preview-candidate
          path: |
            LineLoom-*.vsix
            LineLoom-*.sha256
          if-no-files-found: error
