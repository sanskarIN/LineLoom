name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Superseded PR checks are not release evidence. Keep the newest commit's
# verification. Non-PR runs use their own run ID so a pending main/scheduled
# or manually dispatched run cannot be silently replaced in the same group.
# This group is workflow-specific: CI cannot cancel dependency audit or the
# separately authorized GitHub release publisher.
concurrency:
  group: lineloom-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript, lint, unit tests and build
        run: npm run check
  reference-syntax:
    name: Public reference syntax (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify genuine local toolchains are available
        shell: bash
        run: |
          set -euo pipefail
          command -v rustc
          command -v cc
          command -v c++
          # npm run places this locked local binary on PATH.
          test -x node_modules/.bin/tsc
      - name: Syntax check 30 checked-in public references with real compilers
        run: npm run model:reference:syntax -- --run --approve-local-compilers
  integration:
    name: Extension host (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - name: Run VS Code extension-host integration
        run: xvfb-run -a npm run test:integration
  package:
    name: Stable-channel VSIX candidate (manifest version)
    runs-on: ubuntu-latest
    needs: [check, integration, reference-syntax]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - name: Build genuine stable-channel VSIX and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "LINELOOM_CANDIDATE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          npx vsce package --no-dependencies -o "LineLoom-${VERSION}.vsix"
          LINELOOM_EXPECT_STABLE=1 npm run verify:vsix -- "LineLoom-${VERSION}.vsix"
          sha256sum "LineLoom-${VERSION}.vsix" > "LineLoom-${VERSION}.sha256"
      - name: Install packaged preview candidate in a clean VS Code CLI profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:install-vsix -- "LineLoom-${VERSION}.vsix"
      - name: Download and verify published v1.2.0 stable VSIX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.0.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.0/LineLoom-1.2.0.vsix
          # Pin the GitHub release asset's verified SHA-256, not an
          # untrusted checksum fetched from the same source at test time.
          echo "a968f88faa2515db024cc10cf439213070ac596a9f1eb823263cbd4461951cbd  LineLoom-1.2.0.vsix" | sha256sum --check
      - name: Upgrade published stable to candidate in an isolated VS Code CLI profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:upgrade-vsix -- "LineLoom-1.2.0.vsix" "LineLoom-${VERSION}.vsix"
      - name: Download and verify published v1.2.3 preview VSIX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.3.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.3/LineLoom-1.2.3.vsix
          # SHA-256 independently verified from the public v1.2.3 release asset.
          echo "a940b479f615bfc166a1ba1357f0f2d076532ffac220dbc0194f71fac51d4019  LineLoom-1.2.3.vsix" | sha256sum --check
      - name: Upgrade published v1.2.3 preview to candidate in a separate isolated VS Code CLI profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:upgrade-vsix -- "LineLoom-1.2.3.vsix" "LineLoom-${VERSION}.vsix"
      - name: Download and verify published v1.2.4 preview VSIX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output LineLoom-1.2.4.vsix \
            https://github.com/sanskarIN/LineLoom/releases/download/v1.2.4/LineLoom-1.2.4.vsix
          # Pin the independently verified public release asset digest.
          echo "05a715f49fe332ec53c63de80f3ebdabedc8a55c07ce2aa8b000c69ddee2ccec  LineLoom-1.2.4.vsix" | sha256sum --check
      - name: Upgrade published v1.2.4 preview to candidate in a separate isolated profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          xvfb-run -a npm run test:upgrade-vsix -- "LineLoom-1.2.4.vsix" "LineLoom-${VERSION}.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: lineloom-${{ env.LINELOOM_CANDIDATE_VERSION }}-stable-channel-ci-candidate
          # Never ship the downloaded v1.2.0 baseline as a candidate asset.
          path: |
            LineLoom-${{ env.LINELOOM_CANDIDATE_VERSION }}.vsix
            LineLoom-${{ env.LINELOOM_CANDIDATE_VERSION }}.sha256
          if-no-files-found: error
