name: Prepare release draft
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run check
      - name: Build candidate
        run: npx vsce package --no-dependencies -o LineLoom-${{ github.ref_name }}.vsix
      - run: sha256sum LineLoom-${{ github.ref_name }}.vsix > LineLoom-${{ github.ref_name }}.sha256
      - name: Create draft GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "LineLoom-${{ github.ref_name }}.vsix" "LineLoom-${{ github.ref_name }}.sha256" \
            --draft --title "LineLoom ${{ github.ref_name }} — Privacy-First AI Code Autocomplete" \
            --notes-file docs/releases/v1.0.0.md
