name: Publish LineLoom v0.1.0 pre-release
on:
  push:
    branches: [main]
    paths:
      - .github/release-v0.1.0.flag
permissions:
  contents: read
concurrency:
  group: lineloom-prerelease-v0.1.0
  cancel-in-progress: false
jobs:
  publish:
    name: Verify, package and publish preview
    if: github.repository == 'sanskarIN/LineLoom'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate version
        run: test "$(node -p "require('./package.json').version")" = "0.1.0"
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Typecheck, lint, unit tests, bundle
        run: npm run check
      - name: VS Code extension-host integration with mocked Ollama
        run: xvfb-run -a npm run test:integration
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Package VSIX
        run: npx vsce package --no-dependencies -o LineLoom-0.1.0.vsix
      - name: Verify archive and generate checksum
        run: |
          unzip -t LineLoom-0.1.0.vsix
          sha256sum LineLoom-0.1.0.vsix > LineLoom-0.1.0.sha256
          cat LineLoom-0.1.0.sha256
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0" \
            "LineLoom-0.1.0.vsix" "LineLoom-0.1.0.sha256" \
            --target "${GITHUB_SHA}" --prerelease --latest=false \
            --title "LineLoom v0.1.0 — Initial Preview" \
            --notes-file "docs/releases/v0.1.0.md"
