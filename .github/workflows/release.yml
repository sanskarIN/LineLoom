name: Publish LineLoom v0.2.1 pre-release
on:
  push:
    branches: [main]
    paths:
      - .github/release-v0.2.1.flag
permissions:
  contents: read
concurrency:
  group: lineloom-prerelease-v0.2.1
  cancel-in-progress: false
jobs:
  publish:
    name: Verify, package and publish preview
    if: github.repository == 'sanskarIN/LineLoom'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version
        run: test "$(node -p "require('./package.json').version")" = "0.2.1"
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Typecheck, lint, unit tests, bundle
        run: npm run check
      - name: VS Code extension-host integration with mocked Ollama
        run: xvfb-run -a npm run test:integration
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Package VSIX
        run: npx vsce package --no-dependencies -o LineLoom-0.2.1.vsix
      - name: Verify archive and generate checksum
        run: |
          unzip -t LineLoom-0.2.1.vsix
          sha256sum LineLoom-0.2.1.vsix > LineLoom-0.2.1.sha256
          cat LineLoom-0.2.1.sha256
      - name: Reject duplicate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.2.1" >/dev/null 2>&1; then
            echo "Release v0.2.1 already exists; refusing to overwrite it."
            exit 1
          fi
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.1" \
            "LineLoom-0.2.1.vsix" "LineLoom-0.2.1.sha256" \
            --target "${GITHUB_SHA}" --prerelease --latest=false \
            --title "LineLoom v0.2.1 — Streaming & Cancellation Preview" \
            --notes-file "docs/releases/v0.2.1.md"
