name: Deploy LineLoom GitHub Pages
on:
  push:
    branches: [main]
    # Publish verified current site on each main push, keeping deployment history.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lineloom-pages
  cancel-in-progress: false
jobs:
  build:
    name: Verify and upload static website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test static website
        run: npm run test:site
      # GitHub's Pages API can temporarily return a 5xx while the site is
      # already enabled. Retry this read/configuration step once without
      # treating persistent failure as a successful deployment.
      - name: Configure Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Retry Pages configuration after a failed first attempt
        if: steps.configure_pages.outcome == 'failure'
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    name: Deploy verified GitHub Pages artifact
    if: github.repository == 'sanskarIN/LineLoom'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
