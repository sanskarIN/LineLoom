name: Publish LineLoom v1.2.1 GitHub pre-release (owner authorized)
on:
  push:
    branches: [main]
    paths:
      - .github/release-v1.2.1.flag
permissions:
  contents: read
concurrency:
  group: lineloom-preview-v1.2.1
  cancel-in-progress: false
jobs:
  publish:
    name: Verify, package and publish v1.2.1 preview (not registries)
    if: github.repository == 'sanskarIN/LineLoom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check explicit owner authorization for pre-release
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/release-v1.2.1.flag)" = "OWNER_AUTHORIZED_GITHUB_PRE_RELEASE_V1.2.1_MANUAL_QA_OUTSTANDING"
          grep -q 'Manual QA outstanding' docs/releases/v1.2.1.md
          node -e "const p=require('./package.json'), l=require('./package-lock.json');if(p.name!=='lineloom'||p.publisher!=='SanskarCodes'||p.version!=='1.2.1'||l.version!==p.version||l.packages[''].version!==p.version){throw Error('Unexpected publisher/version/lockfile')}"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify TypeScript source inventory, unit tests, QA and build
        run: npm run check
      - name: Mocked Ollama VS Code extension-host integration
        run: xvfb-run -a npm run test:integration
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Package genuine VS Code pre-release VSIX and checksum
        shell: bash
        run: |
          set -euo pipefail
          npx vsce package --pre-release --no-dependencies -o LineLoom-1.2.1.vsix
          LINELOOM_EXPECT_PRE_RELEASE=1 npm run verify:vsix -- LineLoom-1.2.1.vsix
          sha256sum LineLoom-1.2.1.vsix > LineLoom-1.2.1.sha256
          sha256sum --check LineLoom-1.2.1.sha256
      - name: Install pre-release package in isolated VS Code CLI profile
        run: xvfb-run -a npm run test:install-vsix -- LineLoom-1.2.1.vsix
      - name: Reject duplicate release AND tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.1 >/dev/null 2>&1; then
            echo "Refusing to overwrite existing v1.2.1 release"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.2.1 >/dev/null; then
            echo "Refusing to overwrite existing v1.2.1 tag"
            exit 1
          fi
      - name: Publish GitHub pre-release only, never either marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.2.1 LineLoom-1.2.1.vsix LineLoom-1.2.1.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "LineLoom v1.2.1 — Privacy & Cancellation Maintenance Preview" \
            --notes-file docs/releases/v1.2.1.md
      - name: Verify pre-release classification and asset names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sanskarIN/LineLoom/releases/tags/v1.2.1 \
            --jq 'if (.prerelease == true and (.assets | map(.name) | sort) == ["LineLoom-1.2.1.sha256","LineLoom-1.2.1.vsix"]) then "PASS: pre-release and both assets" else error("Unexpected release metadata or assets") end'
