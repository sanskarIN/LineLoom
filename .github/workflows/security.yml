name: Dependency security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 4 * * 1'
# Superseded PR checks are not release evidence. Keep the newest commit's
# verification. Non-PR runs use their own run ID so a pending main/scheduled
# or manually dispatched run cannot be silently replaced in the same group.
# This group is workflow-specific: CI cannot cancel dependency audit or the
# separately authorized GitHub release publisher.
concurrency:
  group: lineloom-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run test:packager-security
      # The packaged extension contains no development-only VSIX publisher graph.
      # Check runtime dependencies separately and fail on moderate-or-worse risk.
      - name: Audit dependencies that can ship at runtime
        run: npm audit --omit=dev --audit-level=moderate
      # Still enforce the full dependency graph for high/critical findings.
      - name: Audit full build and publishing toolchain
        run: npm audit --audit-level=high
